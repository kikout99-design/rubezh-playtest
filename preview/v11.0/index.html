<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рубеж v11.0 — 3D прототип ассетов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b1b;color:#e7ece4;font:14px system-ui,Arial}#view{position:fixed;inset:0}
.panel{position:fixed;z-index:2;left:18px;top:15px;padding:16px 18px;max-width:420px;background:#14231fdf;border:1px solid #5c786c;border-radius:13px;box-shadow:0 10px 30px #0008}
h1{font-size:19px;margin:0 0 6px}p{margin:6px 0;line-height:1.5;color:#c1d1c6}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
button{background:#37594c;border:1px solid #829c87;border-radius:7px;color:white;padding:9px 12px;cursor:pointer;font-weight:600}button:hover{background:#47745d}
#state{color:#f4db9a;font-weight:600}#legend{position:fixed;bottom:15px;left:18px;z-index:2;background:#14231fce;padding:8px 11px;border-radius:8px;color:#d0dccf}
@media(max-width:650px){.panel{left:8px;right:8px;top:8px;padding:10px}.panel p{font-size:11px}#legend{font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head>
<body><div id="view"></div>
<div class="panel"><h1>РУБЕЖ · v11.0 / графический прототип</h1>
<p>Новая автономная 3D-сцена: земля, дорога, освещение, тени, пулемёт и танк. Основная игра не изменена.</p>
<p>Внешняя модель: <span id="state">загрузка…</span></p>
<div class="controls"><button id="rotate">Поворот камеры: вкл</button><button id="move">Танк: движение</button><button id="light">Время суток</button><button id="reset">Сброс</button></div>
</div><div id="legend">Мышь: колесо — масштаб · перетаскивание — поворот · оригинальная модель: Quaternius (CC0)</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const state=document.getElementById('state'),root=document.getElementById('view');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8c6bd);scene.fog=new THREE.Fog(0xb8c6bd,31,62);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;root.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera(-14,14,8,-8,.1,90);camera.position.set(18,21,24);camera.lookAt(0,0,0);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,0,0);orbit.enableDamping=true;orbit.maxPolarAngle=1.3;orbit.minDistance=9;orbit.maxDistance=48;
const hemi=new THREE.HemisphereLight(0xdfeeff,0x53614d,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0aa,3.0);sun.position.set(-10,22,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;sun.shadow.normalBias=.025;scene.add(sun);
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const soil=mat(0x666a4e),road=mat(0x827762),shoulder=mat(0x69644d),track=mat(0x615b4d),olive=mat(0x4d614d,.82,.17),steel=mat(0x343c37,.68,.32),sand=mat(0xaaa07b),rock=mat(0x85857b),dark=mat(0x2d3733,.86,.18);
function mesh(geo,m,x,y,z,cast=true){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
mesh(new THREE.BoxGeometry(120,.75,120),soil,0,-.55,0,false);
const roadPts=[[-16,-5],[-8,-5],[-4,-4],[0,-2],[4,0],[8,0],[16,0]];
function stripe(points,width,height,material){
 const verts=[];const indices=[];
 for(let i=0;i<points.length;i++){
 const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
 verts.push(points[i][0]-dy/l*width/2,height,points[i][1]+dx/l*width/2);
 verts.push(points[i][0]+dy/l*width/2,height,points[i][1]-dx/l*width/2);
 if(i<points.length-1){const v=i*2;indices.push(v,v+1,v+2,v+1,v+3,v+2)}
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();
 const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);return m;
}
stripe(roadPts,5.6,-.145,shoulder);stripe(roadPts,4.65,-.12,road);
for(const off of [-1.3,1.3]){const pts=roadPts.map(([x,z])=>[x,z+off]);stripe(pts,.12,-.106,track)}
let seed=46;function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const boulderGeo=[new THREE.DodecahedronGeometry(1,0),new THREE.IcosahedronGeometry(1,0)];
for(let i=0;i<125;i++){
 const x=(rng()-.5)*37,z=(rng()-.5)*25;if(Math.abs(z-(x<-4?-5:x<4?x*.35-2:0))<4.4)continue;
 const scale=.17+rng()*.65;const o=mesh(boulderGeo[Math.floor(rng()*2)],rng()>.45?rock:sand,x,-.05,z);o.scale.set(scale,scale*(.4+rng()*.6),scale*.85);o.rotation.y=rng()*6.28;
}
for(let i=0;i<180;i++){
 const x=(rng()-.5)*38,z=(rng()-.5)*26;if(Math.abs(z-(x<-4?-5:x<4?x*.35-2:0))<3.7)continue;
 let m=mesh(new THREE.ConeGeometry(.16+rng()*.16,.25+rng()*.32,4),rng()>.5?olive:shoulder,x,.02,z,false);m.rotation.y=rng()*3;
}
function crate(x,z){const m=mesh(new THREE.BoxGeometry(.88,.75,.88),sand,x,.25,z);const trim=mesh(new THREE.BoxGeometry(.97,.08,.97),steel,x,.64,z);return m}
for(let i=0;i<6;i++)crate(5+i*.91,5);
function sandbag(x,z){const m=mesh(new THREE.CapsuleGeometry(.22,.65,4,7),sand,x,.15,z);m.rotation.z=Math.PI/2;return m}
for(let i=0;i<9;i++)sandbag(-3+i*.6,4.3);
function fallbackTank(){
 const g=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(2.15,.65,1.25),olive);hull.position.y=.7;g.add(hull);
 for(const side of [-.72,.72]){const tr=new THREE.Mesh(new THREE.BoxGeometry(2.25,.54,.36),steel);tr.position.set(0,.45,side);g.add(tr);
 for(let i=-1;i<=1;i++){const w=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.08,12),dark);w.rotation.x=Math.PI/2;w.position.set(i*.7,.43,side*1.22);g.add(w)}}
 const turret=new THREE.Group();turret.position.y=1.2;const dome=new THREE.Mesh(new THREE.BoxGeometry(1.18,.4,.84),olive);turret.add(dome);const gun=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,2.1,10),steel);gun.rotation.z=Math.PI/2;gun.position.set(1.23,.08,0);turret.add(gun);g.add(turret);return g;
}
const tankRoot=new THREE.Group();tankRoot.position.set(-8,0,-5);scene.add(tankRoot);
function setTank(g){tankRoot.clear();g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});tankRoot.add(g)}
setTank(fallbackTank());state.textContent='проверка загрузки GLB…';
const url='https://raw.githubusercontent.com/tourzhao/Tanks3D/main/resources/models/tank_basic.glb';
new GLTFLoader().load(url,gltf=>{
 const obj=gltf.scene;obj.updateMatrixWorld(true);const bbox=new THREE.Box3().setFromObject(obj),size=bbox.getSize(new THREE.Vector3()),center=bbox.getCenter(new THREE.Vector3());
 const max=Math.max(size.x,size.z,size.y),scale=2.8/Math.max(.001,max);
 obj.scale.setScalar(scale);obj.position.set(-center.x*scale,-bbox.min.y*scale,-center.z*scale);
 const rot=new THREE.Group();rot.add(obj);setTank(rot);
 state.textContent='GLB загружен: танк Quaternius, лицензия CC0';state.style.color='#a9ecba';
},undefined,error=>{state.textContent='GLB не загрузился — показана временная модель';state.style.color='#ffbda8';console.warn('External GLB failure',error)});
const tower=new THREE.Group();tower.position.set(2.3,.2,3.8);scene.add(tower);
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.25,.4,8),steel);base.castShadow=true;base.receiveShadow=true;tower.add(base);
const upper=new THREE.Group();upper.position.y=.65;tower.add(upper);
const turret=new THREE.Mesh(new THREE.BoxGeometry(1.15,.65,1.05),olive);turret.castShadow=true;upper.add(turret);
for(let off of [-.25,.25]){const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.075,.11,1.7,10),dark);barrel.rotation.z=Math.PI/2;barrel.position.set(1.13,0,off);barrel.castShadow=true;upper.add(barrel)}
const disk=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.45,.22,8),sand);disk.position.y=-.25;disk.receiveShadow=true;tower.add(disk);
let autoRotate=true,moving=true,night=false,offset=0,forward=true,last=performance.now();
document.getElementById('rotate').onclick=()=>{autoRotate=!autoRotate;document.getElementById('rotate').textContent='Поворот камеры: '+(autoRotate?'вкл':'выкл')};
document.getElementById('move').onclick=()=>{moving=!moving;document.getElementById('move').textContent='Танк: '+(moving?'движение':'стоп')};
document.getElementById('light').onclick=()=>{night=!night;sun.intensity=night?1:3;hemi.intensity=night?.85:2;scene.background.setHex(night?0x303b47:0xb8c6bd);scene.fog.color.copy(scene.background);renderer.toneMappingExposure=night?.75:1.22};
document.getElementById('reset').onclick=()=>{offset=0;forward=true;camera.position.set(18,21,24);orbit.target.set(0,0,0);orbit.update()};
function draw(now){requestAnimationFrame(draw);const dt=Math.min(.06,(now-last)/1000);last=now;
 if(autoRotate){const p=camera.position.clone().sub(orbit.target),a=dt*.055;camera.position.set(orbit.target.x+p.x*Math.cos(a)-p.z*Math.sin(a),camera.position.y,orbit.target.z+p.x*Math.sin(a)+p.z*Math.cos(a))}
 if(moving){offset+=(forward?1:-1)*dt*.9;if(offset>12){forward=false}if(offset<0){forward=true}tankRoot.position.x=-8+offset;tankRoot.position.z=-5+Math.max(0,offset-5)*.19;tankRoot.rotation.y=forward?-.10:Math.PI-.10}
 upper.rotation.y=Math.sin(now*.0007)*.9;orbit.update();const aspect=innerWidth/innerHeight;camera.left=-12*aspect;camera.right=12*aspect;camera.top=12;camera.bottom=-12;camera.updateProjectionMatrix();renderer.render(scene,camera)}
requestAnimationFrame(draw);addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
</script></body></html>
